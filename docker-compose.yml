version: '3.9'

services:
  # ===========================
  # DATABASE LAYER
  # ===========================
  
  primary-db:
    image: mysql:8.0
    container_name: primary-db
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_pass
      MYSQL_DATABASE: strongdatabase
      MYSQL_USER: mysql_user
      MYSQL_PASSWORD: mysql_pass
      MYSQL_REPLICATION_USER: replicator
      MYSQL_REPLICATION_PASSWORD: replicator_pass
    ports:
      - '3307:3306'
    volumes:
      - ./database/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
      - ./database/mysql-primary.cnf:/etc/mysql/conf.d/mysql-primary.cnf:ro
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --sync_binlog=1
      --binlog_format=ROW
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_slave_updates=ON
      --read_only=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mysql_user", "-pmysql_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=primary-db,environment=development"
    networks:
      - strongdatabase_net

  standby-db:
    image: mysql:8.0
    container_name: standby-db
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_pass
      MYSQL_DATABASE: strongdatabase
      MYSQL_USER: mysql_user
      MYSQL_PASSWORD: mysql_pass
      MYSQL_REPLICATION_USER: replicator
      MYSQL_REPLICATION_PASSWORD: replicator_pass
      MYSQL_MASTER_HOST: primary-db
      MYSQL_MASTER_PORT: 3306
    ports:
      - '3308:3306'
    volumes:
      - ./database/setup-mysql-replica.sh:/docker-entrypoint-initdb.d/setup-replica.sh:ro
      - ./database/mysql-replica.cnf:/etc/mysql/conf.d/mysql-replica.cnf:ro
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --sync_binlog=1
      --binlog_format=ROW
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_slave_updates=ON
      --read_only=ON
      --super_read_only=ON
    depends_on:
      primary-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mysql_user", "-pmysql_pass"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=standby-db,environment=development"
    networks:
      - strongdatabase_net

  replica1-db:
    image: mysql:8.0
    container_name: replica1-db
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_pass
      MYSQL_DATABASE: strongdatabase
      MYSQL_USER: mysql_user
      MYSQL_PASSWORD: mysql_pass
      MYSQL_REPLICATION_USER: replicator
      MYSQL_REPLICATION_PASSWORD: replicator_pass
      MYSQL_MASTER_HOST: primary-db
      MYSQL_MASTER_PORT: 3306
    ports:
      - '3309:3306'
    volumes:
      - ./database/setup-mysql-replica.sh:/docker-entrypoint-initdb.d/setup-replica.sh:ro
      - ./database/mysql-replica.cnf:/etc/mysql/conf.d/mysql-replica.cnf:ro
    command: >
      --server-id=3
      --log-bin=mysql-bin
      --sync_binlog=1
      --binlog_format=ROW
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_slave_updates=ON
      --read_only=ON
      --super_read_only=ON
    depends_on:
      primary-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mysql_user", "-pmysql_pass"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=replica1-db,environment=development"
    networks:
      - strongdatabase_net

  replica2-db:
    image: mysql:8.0
    container_name: replica2-db
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_pass
      MYSQL_DATABASE: strongdatabase
      MYSQL_USER: mysql_user
      MYSQL_PASSWORD: mysql_pass
      MYSQL_REPLICATION_USER: replicator
      MYSQL_REPLICATION_PASSWORD: replicator_pass
      MYSQL_MASTER_HOST: primary-db
      MYSQL_MASTER_PORT: 3306
    ports:
      - '3310:3306'
    volumes:
      - ./database/setup-mysql-replica.sh:/docker-entrypoint-initdb.d/setup-replica.sh:ro
      - ./database/mysql-replica.cnf:/etc/mysql/conf.d/mysql-replica.cnf:ro
    command: >
      --server-id=4
      --log-bin=mysql-bin
      --sync_binlog=1
      --binlog_format=ROW
      --gtid_mode=ON
      --enforce_gtid_consistency=ON
      --log_slave_updates=ON
      --read_only=ON
      --super_read_only=ON
    depends_on:
      primary-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mysql_user", "-pmysql_pass"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=replica2-db,environment=development"
    networks:
      - strongdatabase_net

  # ===========================
  # API LAYER
  # ===========================
  
  api:
    build:
      context: .
      dockerfile: api/StrongDatabase.Api/Dockerfile
    container_name: strongdatabase-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ElasticConfiguration__Uri=http://elasticsearch:9200
    ports:
      - "5000:80"
    depends_on:
      primary-db:
        condition: service_healthy
      standby-db:
        condition: service_healthy
      replica1-db:
        condition: service_healthy  
      replica2-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=strongdatabase-api,environment=development"
    networks:
      - strongdatabase_net

  # ===========================
  # MONITORING LAYER (ELK Stack)
  # ===========================
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=elasticsearch,environment=development"
    networks:
      - strongdatabase_net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./monitoring/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xmx1g -Xms512m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=logstash,environment=development"
    networks:
      - strongdatabase_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - xpack.encryptedSavedObjects.encryptionKey=strongdatabase-kibana-encryption-key-32-chars
    volumes:
      - ./monitoring/dashboards:/usr/share/kibana/data/dashboards:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=kibana,environment=development"
    networks:
      - strongdatabase_net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: filebeat
    user: root
    command: >
      filebeat
      -e
      -strict.perms=false
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ELASTICSEARCH_HOST=elasticsearch:9200
      - KIBANA_HOST=kibana:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=filebeat,environment=development"
    networks:
      - strongdatabase_net

# ===========================
# NETWORKS & VOLUMES
# ===========================

volumes:
  elasticsearch_data:
    driver: local

networks:
  strongdatabase_net:
    driver: bridge 